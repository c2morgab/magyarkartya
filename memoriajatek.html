<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memóriajáték</title>
</head>
<body>
    <form action="#" method="post" onsubmit="tablazat(event)">
        <input type="number" name="elso" id="elso" min="3" max="8">
        <input type="number" name="masodik" id="masodik" min="3" max="8">
        <input type="submit" value="Létrehoz">
    </form>
    <table id="tablazat"></table>
    <script>
        function tablazat(e)
        {
            e.preventDefault();
            let elso = document.getElementById('elso').value;
            let masodik = document.getElementById('masodik').value;
            if (elso * masodik % 2 == 0)
            {
                let par_db = (elso * masodik) / 2;
                let rnd_array = new Array();
                while (rnd_array.length < par_db)
                {
                    let tmp = Math.floor(Math.random() * 32) + 1;
                    if (rnd_array.includes(tmp)) continue;
                    else rnd_array.push(tmp);
                }
                console.log("Random kártyák: " + rnd_array);
                console.log("Első szám: " + elso + "\nMásodik szám: " + masodik + "\nHány darab pár: " + par_db);
                let tabla= "";
                for (i = 0; i < elso; i++)
                {
                    tabla += "<tr>"
                    for (j = 0; j < masodik; j++)
                    {
                        tabla += "<td>a</td>"
                    }
                    tabla += "</tr>"
                }
                document.getElementById("tablazat").innerHTML = tabla
            }
        }
    </script>
</body>
</html>
